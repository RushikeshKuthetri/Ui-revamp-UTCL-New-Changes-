<div class="">
  <div class="row gap-4 !p-0 justify-center">
    <ng-container *ngIf="datasource?.Tags_Data?.length > 0; else noGauge">
      <div
        class="col-xl-3 col-lg-4 col-md-8 col-sm-12 col-12 rounded-lg !border !border-[var(--input-enable-border)] !p-0"
        *ngFor="let item of datasource.Tags_Data;let i=index">
        <div class=" shadow-[var(--card-shadow)]
    h-full   cursor-pointer px-0.5
    hover:border-orange-500 hover:shadow-orange-500/40
    transition-all duration-200" (dblclick)="getBarData($event,item,i);openModal(template)">
          <div class="text-[var(--text-color)] text-xl font-semibold text-center px-2 py-2" title="{{item.Process_Values}}">
            {{item.Process_Values.toFixed(2)}}
          </div>
          <div class="text-[var(--text-color)] flex flex-col items-center min-h-[160px] " #myTestDiv>
            <div id="{{'g'+i}}" class="chartDiv  text-[var(--text-color)] text-md">
              <app-gauge-chart [value]="item.Process_Values" [min]="item.Min_Value" [max]="item.Max_Value"
                [unit]="item.Unit"></app-gauge-chart>
            </div>

            <div class="value_span d-flex text-[var(--text-color)] text-[13px]">
              <span title="{{item.Generic_Description}}" class="whitespace-normal break-words">
                {{item.Generic_Description}}
              </span>
            </div>

            <!-- <div class="value_span d-flex text-[var(--text-color)] text-[13px]">
              <span title="{{item.Generic_Description}}">
                {{item.Generic_Description}}
              </span>
            </div> -->
          </div>

        </div>
      </div>
    </ng-container>
    <ng-template #noGauge>
      <div class="col-12 text-center text-gray-500 py-8">
        No gauge data available
      </div>
    </ng-template>
  </div>
</div>

<ng-template #template>

  <div class="bg-[var(--card-bg)] rounded-xl w-full">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-4 py-3 !border-b !border-[var(--input-enable-border)]">

      <h4 class="text-[15px] font-semibold text-[var(--text-color)]">
        History Data for {{title}}
      </h4>

      <button type="button" (click)="modalRef?.hide()" class="flex items-center justify-center w-7 h-7 rounded-md
        hover:bg-[var(--table-hover)] transition">
        <span class="material-symbols-outlined text-[18px] text-[var(--text-color)]">
          close
        </span>
      </button>

    </div>

    <!-- BODY -->
    <div class="p-4 space-y-4">

      <div class="max-w-40">
        <app-datetimepicker (dateTimeRange)="getDateRange($event)" type="rangepicker"
          [selectedRange]="graphDateRange"></app-datetimepicker>
      </div>
      <!-- DATE RANGE -->


      <!-- LINE CHART -->
      <div class="w-full">
        <app-line-chart [data]="barData" [title]="title" *ngIf="showLine"></app-line-chart>
      </div>

    </div>

  </div>

</ng-template>
