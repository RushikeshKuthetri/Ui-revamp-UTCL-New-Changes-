<!-- <span class="loader"></span> -->



<div class="loader-overlay">
    <div class="loader-content">
      <div class="loader-ring-wrapper">
   
        <!-- Pulse ring 1 -->
        <div class="pulse-ring pulse-ring-1"></div>
   
        <!-- Pulse ring 2 -->
        <div class="pulse-ring pulse-ring-2"></div>
   
        <!-- SVG Ring -->
        <svg class="ring-spin" width="140" height="140" viewBox="0 0 140 140">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"  stop-color="#f0a020" />
              <stop offset="45%" stop-color="#C67614" />
            </linearGradient>
          </defs>
   
          <circle fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" cx="70" cy="70" r="60" />
   
          <circle
            fill="none"
            stroke="url(#arcGrad)"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-dasharray="240"
            stroke-dashoffset="60"
            cx="70" cy="70" r="60"
            transform="rotate(-90 70 70)"
          />
   
          <circle
            class="arc-tail"
            fill="none"
            stroke="rgba(229,131,52,0.6)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="60"
            cx="70" cy="70" r="60"
            transform="rotate(-90 70 70)"
          />
        </svg>
   
        <!-- Logo -->
        <div class="logo-wrapper">
          <div class="logo-circle">
            <!-- Replace with your actual logo image path -->
            <img  src="assets/loader.png" alt="logo" class="logo-img" />
          </div>
        </div>
   
      </div>
    </div>
  </div>
