<div
  class="fixed inset-0 w-screen h-screen bg-no-repeat bg-cover bg-center"
  [ngStyle]="{ 'background-image': 'url(' + imagePath.img + ')' }"
>
  <!-- Floating Login Button (like React) -->
  <div
    class="fixed flex flex-col items-center justify-center
           md:right-[8vw] lg:right-[13vw] xl:right-[13vw] 2xl:right-[15vw]
           top-[55vh]"
  >
    <div class="right">
      <button
        class="bg-[#F1E0CD] text-[#111111] border border-[#C7743A]
               text-xs sm:text-sm md:text-base lg:text-md 2xl:text-lg
               px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 2xl:px-12
               py-2 sm:py-2.5 md:py-3 lg:py-3.5 xl:py-6 2xl:py-6
               rounded-full shadow hover:shadow-md hover:scale-105
               transition-all duration-200"
        (click)="login()"
      >
        Sign in with Microsoft
      </button>
    </div>
  </div>
</div>
